include ~/.cache/minos/theme/kitty.conf


# ==========================================
# KITTY - MINIMAL DARK CONFIGURATION
# ==========================================

shell fish

# FONT
font_family JetBrainsMono Nerd Font Mono
#bold_font auto
#italic_font auto
#bold_italic_font auto
font_size 12

# CURSOR
cursor_shape beam
cursor_beam_thickness 7
cursor_stop_blinking_after 0
# Enable cursor trail (value = ms the cursor must stay still before trail triggers)
cursor_trail 3

shell_integration disabled

# Animated fade blink (0.5s total, ease-in-out)
cursor_blink_interval 0.6 ease-in-out

# Different easing for fade-in vs fade-out
cursor_blink_interval 0.6 linear ease-out   

# Animation decay (controls speed of the trail fading)
cursor_trail_decay 0.1 0.4

# Minimum cells the cursor must move before the trail starts (x y)
cursor_trail_start_threshold 0   

# Stop blinking after 15s of keyboard inactivity (0 = never stop)
cursor_stop_blinking_after 15.0

# Shape when window is unfocused
cursor_shape_unfocused hollow   

# WINDOW
remember_window_size no
initial_window_width 110c
initial_window_height 30c
window_padding_width 15
hide_window_decorations yes
background_opacity 0.92
dynamic_background_opacity yes
scrollbar_handle_opacity 0
scrollbar_track_opacity 0


# INSTANT REDRAW
repaint_delay 8
input_delay 3
sync_to_monitor no

# TERMINAL BEHAVIOR
enable_audio_bell no
confirm_os_window_close 0
copy_on_select clipboard
strip_trailing_spaces smart
repaint_delay 10
input_delay 3
sync_to_monitor yes

# TAB BAR
tab_bar_edge bottom
tab_bar_style powerline
tab_powerline_style slanted
tab_bar_min_tabs 2
tab_title_template "{title}"

# MOUSE
url_style curly
detect_urls yes
open_url_with default

# PERFORMANCE
repaint_delay 10
```

### 2. Keep your existing theme system

Since your theme switcher already controls Kitty colors, **don't add hardcoded background or foreground colors** here.

That way, switching between One Dark, Tokyo Night, Everforest, and your other themes will continue working.

### 3. Reload Kitty

Press:

`Ctrl + Shift + F5`

Or restart Kitty.

